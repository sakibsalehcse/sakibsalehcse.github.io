<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subnet Calculator</title>
<style>
:root{
  --bg:#f3f6f4;--surface:#ffffff;--ink:#14231c;--muted:#5b6b62;--line:#d5ddd8;
  --net:#0b6b4f;--host:#b4541a;--accent:#0b6b4f;--accent-ink:#ffffff;--hl:#e3f2ea;--err:#b3261e;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a15;--surface:#16241d;--ink:#e6efe9;--muted:#93a69b;--line:#2a3d33;
    --net:#5fd3a4;--host:#ffa768;--accent:#5fd3a4;--accent-ink:#0f1a15;--hl:#1c3a2c;--err:#ff8a80;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a15;--surface:#16241d;--ink:#e6efe9;--muted:#93a69b;--line:#2a3d33;
  --net:#5fd3a4;--host:#ffa768;--accent:#5fd3a4;--accent-ink:#0f1a15;--hl:#1c3a2c;--err:#ff8a80;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 22px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.inputrow{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:1.15rem;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input:focus{outline:3px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
button{font:inherit;cursor:pointer}
.go{padding:0 20px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.go:focus-visible,.chip:focus-visible,.copy:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:.85rem}
.hint{color:var(--muted);font-size:.85rem;margin:10px 0 0}
.err{color:var(--err);margin:14px 0 0;font-weight:500}
#out{margin-top:24px}
.gw{background:var(--hl);border:1px solid var(--accent);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.gw small{color:var(--muted);display:block}
.gw .big{font-size:1.7rem;font-weight:700;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .k{flex:0 0 42%;color:var(--muted);font-size:.95rem}
.row .v{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.copy{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:6px;padding:2px 9px;font-size:.78rem}
.bin{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.bin h2{font-size:.95rem;margin:0 0 8px}
.bin .line{display:flex;gap:10px;align-items:baseline;overflow-x:auto;padding:3px 0;white-space:nowrap}
.bin .lab{flex:0 0 72px;color:var(--muted);font-size:.8rem}
.n{color:var(--net);font-weight:700}.h{color:var(--host);font-weight:700}
.legend{font-size:.82rem;color:var(--muted);margin-top:8px}
.legend b{font-weight:700}
.note{color:var(--muted);font-size:.85rem;margin-top:14px}
@media (max-width:480px){.row .k{flex-basis:38%}.go{padding:0 14px}}
</style>
<link rel="stylesheet" href="tools.css">
<script>(function(){try{var v=localStorage.getItem("sakib-theme");if(v==="graphite"||v==="neon"||v==="mono")document.documentElement.dataset.pf=v}catch(e){}})()</script>
</head>
<body><nav class="pf-bar" aria-label="Portfolio"><a class="pf-home" href="../index.html">&lt;/&gt; Sakib<span>.Saleh</span></a><div class="pf-links"><a href="../pages/tools.html">All tools</a><a href="mikrotik-setup-studio.html">Setup Studio</a><a href="mikrotik-config-generator.html">Config Generator</a><a href="mikrotik-troubleshooting-desk.html">Troubleshooting Desk</a><a href="subnet-calculator.html" aria-current="page">Subnet Calculator</a><a href="slab-calculator.html">Slab Calculator</a><a href="fiber-fix.html">Fiber Fix</a></div></nav>
<main>
  <h1>Subnet calculator</h1>
  <p class="sub">Type an IP with its prefix and get the network, gateway, broadcast and host range.</p>

  <div class="inputrow">
    <input id="ip" class="mono" value="10.20.30.11/20" inputmode="text" autocomplete="off" spellcheck="false" aria-label="IP address with prefix, for example 10.20.30.11/20">
    <button class="go" id="go">Calculate</button>
  </div>
  <div class="chips" id="chips"></div>
  <p class="hint">Accepted: <span class="mono">10.20.30.11/20</span> or <span class="mono">10.20.30.11 255.255.240.0</span></p>
  <div id="err" class="err" role="alert"></div>
  <div id="out"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const toInt = p => ((p[0]<<24)|(p[1]<<16)|(p[2]<<8)|p[3])>>>0;
const toIp = n => [n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const maskOf = p => p===0 ? 0 : (0xFFFFFFFF << (32-p))>>>0;

function parseIp(s){
  const m = s.split('.');
  if(m.length!==4) return null;
  const p = m.map(x=>/^\d{1,3}$/.test(x)?Number(x):NaN);
  return p.some(x=>isNaN(x)||x>255) ? null : p;
}
function prefixFromMask(s){
  const p = parseIp(s); if(!p) return null;
  const n = toInt(p); const bin = n.toString(2).padStart(32,'0');
  return /^1*0*$/.test(bin) ? bin.indexOf('0')===-1 ? 32 : bin.indexOf('0') : null;
}
function parse(input){
  const s = input.trim().replace(/\s+/g,' ');
  let ipPart, prefix;
  if(s.includes('/')){
    const [a,b] = s.split('/'); ipPart=a.trim();
    if(!/^\d{1,2}$/.test(b.trim()) || Number(b)>32) return {error:'The prefix after / must be a number from 0 to 32.'};
    prefix = Number(b);
  } else if(s.includes(' ')){
    const [a,b] = s.split(' '); ipPart=a;
    prefix = prefixFromMask(b);
    if(prefix===null) return {error:'That subnet mask is not valid. A mask looks like 255.255.240.0.'};
  } else return {error:'Add a prefix, for example 10.20.30.11/20.'};
  const p = parseIp(ipPart);
  if(!p) return {error:'That IP address is not valid. Use four numbers from 0 to 255, like 10.20.30.11.'};
  return {ip:p, prefix};
}
function ipType(p){
  const [a,b]=p;
  if(a===10) return 'Private (RFC 1918)';
  if(a===172&&b>=16&&b<=31) return 'Private (RFC 1918)';
  if(a===192&&b===168) return 'Private (RFC 1918)';
  if(a===127) return 'Loopback';
  if(a===169&&b===254) return 'Link-local (APIPA)';
  if(a===100&&b>=64&&b<=127) return 'Shared / CGNAT';
  if(a>=224&&a<=239) return 'Multicast';
  if(a>=240) return 'Reserved';
  return 'Public';
}
function ipClass(a){return a<128?'A':a<192?'B':a<224?'C':a<240?'D (multicast)':'E (reserved)'}
function bits(n,prefix){
  const b = n.toString(2).padStart(32,'0'); let html='';
  for(let i=0;i<32;i++){
    if(i&&i%8===0) html+=' ';
    html+=`<span class="${i<prefix?'n':'h'}">${b[i]}</span>`;
  }
  return html;
}
function compute(p, prefix){
  const ip=toInt(p), mask=maskOf(prefix), wild=(~mask)>>>0;
  const net=(ip&mask)>>>0, bc=(net|wild)>>>0;
  const total=Math.pow(2,32-prefix);
  let first,last,usable;
  if(prefix===32){first=last=net;usable=1}
  else if(prefix===31){first=net;last=bc;usable=2}
  else{first=net+1;last=bc-1;usable=total-2}
  return {ip,mask,wild,net,bc,total,first,last,usable};
}
function row(k,v,copy=true){
  return `<div class="row"><div class="k">${k}</div><div class="v mono">${v}</div>${copy?`<button class="copy" data-v="${v}">Copy</button>`:''}</div>`;
}
function render(){
  const r = parse($('ip').value);
  $('err').textContent = r.error||'';
  if(r.error){ $('out').innerHTML=''; return; }
  const c = compute(r.ip, r.prefix);
  const gwNote = r.prefix>=31
    ? 'This prefix has no normal gateway range. /31 is for point-to-point links and /32 is a single host.'
    : `Most networks use the first usable address as the gateway. The last usable address, <span class="mono">${toIp(c.last)}</span>, is the other common choice. Use whatever your router is actually set to.`;
  $('out').innerHTML = `
    <div class="gw"><small>Default gateway (first usable)</small><span class="big mono">${toIp(c.first)}</span><small style="margin-top:6px">${gwNote}</small></div>
    <div class="card">
      ${row('IP address',toIp(c.ip))}
      ${row('Network address',toIp(c.net))}
      ${row('Subnet mask',toIp(c.mask))}
      ${row('Prefix (CIDR)','/'+r.prefix)}
      ${row('Wildcard mask',toIp(c.wild))}
      ${row('Broadcast address',toIp(c.bc))}
      ${row('First usable host',toIp(c.first))}
      ${row('Last usable host',toIp(c.last))}
      ${row('Usable hosts',c.usable.toLocaleString('en-US'))}
      ${row('Total addresses',c.total.toLocaleString('en-US'))}
      ${row('IP class',ipClass(r.ip[0]),false)}
      ${row('Address type',ipType(r.ip),false)}
    </div>
    <div class="bin">
      <h2>Binary view</h2>
      <div class="line mono"><span class="lab">IP</span><span>${bits(c.ip,r.prefix)}</span></div>
      <div class="line mono"><span class="lab">Mask</span><span>${bits(c.mask,r.prefix)}</span></div>
      <div class="line mono"><span class="lab">Network</span><span>${bits(c.net,r.prefix)}</span></div>
      <div class="legend"><b class="n">Green</b> bits are the network part (${r.prefix} bits). <b class="h">Orange</b> bits are the host part (${32-r.prefix} bits).</div>
    </div>
    <p class="note">Network address = IP AND mask. Broadcast = network with all host bits set to 1.</p>`;
}
$('go').addEventListener('click',render);
$('ip').addEventListener('keydown',e=>{if(e.key==='Enter')render()});
$('ip').addEventListener('input',render);
$('out').addEventListener('click',e=>{
  const b=e.target.closest('.copy'); if(!b) return;
  const done=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)};
  try{navigator.clipboard.writeText(b.dataset.v).then(done,()=>{})}catch(_){}
});
['10.20.30.11/20','192.168.1.10/24','172.16.5.9/22','10.0.0.5/30'].forEach(s=>{
  const b=document.createElement('button');b.className='chip mono';b.textContent=s;
  b.onclick=()=>{$('ip').value=s;render()};$('chips').appendChild(b);
});
render();
</script>
</body>
</html>
